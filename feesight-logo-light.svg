<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Feesight logo</title>
  <desc id="desc">Feesight wordmark with eye icon containing two child silhouettes</desc>
  <defs>
    <linearGradient id="fsBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2EA8FF"/>
      <stop offset="55%" stop-color="#1663DA"/>
      <stop offset="100%" stop-color="#0B2F8A"/>
    </linearGradient>
    <linearGradient id="fsGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#D9EDFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fsPupil" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#173FAE"/>
      <stop offset="100%" stop-color="#082669"/>
    </linearGradient>
    <linearGradient id="fsChildren" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B9DEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2F8A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="translate(16 14)">
    <path d="M54 106C111 36 175 6 253 6c78 0 142 30 199 100-57 70-121 100-199 100-78 0-142-30-199-100Z" fill="url(#fsBlue)"/>
    <path d="M96 106c45-50 94-72 157-72 63 0 112 22 157 72-45 50-94 72-157 72-63 0-112-22-157-72Z" fill="#F8FBFF"/>
    <path d="M152 106c0-48 40-88 101-88s101 40 101 88-40 88-101 88-101-40-101-88Z" fill="url(#fsPupil)"/>
    <path d="M215 58l24-17 24 17-4 28h-40Z" fill="url(#fsChildren)"/>
    <rect x="231" y="43" width="3" height="16" rx="1.5" fill="#E8F4FF"/>
    <circle cx="239" cy="74" r="19" fill="url(#fsChildren)"/>
    <path d="M206 121c0-27 16-43 39-43 25 0 41 16 41 43v40h-16v-39c0-12-7-22-25-22s-24 10-24 22v39h-15Z" fill="url(#fsChildren)"/>
    <circle cx="301" cy="100" r="15" fill="url(#fsChildren)"/>
    <path d="M279 138c0-20 12-31 30-31 18 0 30 11 30 31v24h-12v-22c0-10-6-19-18-19-13 0-18 9-18 19v22h-12Z" fill="url(#fsChildren)"/>
    <path d="M252 186c84 0 133-29 173-80 14 7 26 16 37 27-50 55-116 79-210 79-86 0-156-29-209-106 8-10 18-19 31-27 48 69 97 107 178 107Z" fill="url(#fsGlow)" opacity=".68"/>
  </g>

  <g transform="translate(470 64)">
    <text x="0" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="112" font-weight="800" fill="url(#fsBlue)" letter-spacing="-3">Feesight</text>
    <text x="2" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="600" fill="#5C6C8F" letter-spacing="2.4">SCHOOL FEES ANALYSER</text>
  </g>
</svg>
